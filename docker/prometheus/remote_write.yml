
# --- Ajouté au démarrage SEULEMENT si GRAFANA_CLOUD_* sont dans .env (voir start.sh) ---
# Envoie une copie des chiffres SmartSupply à Grafana Cloud (tableau public).
# Seuls les chiffres utiles au tableau partent (quelques centaines de séries,
# loin de la limite gratuite de 10 000).
remote_write:
  - url: __GRAFANA_CLOUD_PROM_URL__
    basic_auth:
      username: "__GRAFANA_CLOUD_PROM_USER__"
      password_file: /tmp/grafana_cloud_token
    write_relabel_configs:
      - source_labels: [__name__]
        regex: "smartsupply_.+|ALERTS|up|pg_stat_database_xact_commit|pg_database_size_bytes|process_resident_memory_bytes"
        action: keep
