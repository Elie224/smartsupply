# Prometheus de SmartSupply : http://127.0.0.1:19090
# Relève toutes les 30 s les chiffres des services (noms = services du docker-compose).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Les alertes déclenchées partent vers Alertmanager, qui les envoie par e-mail.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Chiffres déposés par le cycle nocturne à la fin de chaque passage
  - job_name: pipeline
    honor_labels: true            # garde le libellé job="smartsupply_pipeline" déposé par le cycle
    static_configs:
      - targets: ["pushgateway:9091"]

  # Base de données : connexions, taille, transactions, requêtes en cours...
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # MLflow : nombre et durée des requêtes
  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]

  # Prefect : runs, files d'attente, API
  - job_name: prefect
    metrics_path: /api/metrics
    static_configs:
      - targets: ["prefect:4200"]

  # API de prévision : requêtes, temps de réponse, prévisions calculées
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Alertmanager (envoi des alertes)
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
