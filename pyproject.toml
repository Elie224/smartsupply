[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsupply"
version = "0.1.0"
description = "SmartSupply AI - prévision de la demande et risque de rupture (données synthétiques)"
requires-python = ">=3.11"
dependencies = [
    "faker>=30",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "prefect>=3,<4",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "joblib>=1.4",
    "mlflow-skinny==3.18.0",
    "prometheus-client>=0.20",   # chiffres du cycle publiés pour Prometheus
    "fastapi>=0.115",            # API de prévision (smartsupply.api)
    "uvicorn>=0.30",   # client MLflow léger ; même version que le serveur (docker/mlflow)
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
